# Run the Quotebook Next.js frontend against the hosted Convex Cloud backend.
# The image clones the repo itself, so this needs no local source — just Docker.
#
#   docker compose up --build
#
# Override the backend or the source branch if needed:
#   CONVEX_URL=https://your-deployment.convex.cloud docker compose up --build
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CONVEX_URL: ${CONVEX_URL:-https://veracious-stork-385.convex.cloud}
        REPO_URL: ${REPO_URL:-https://github.com/AKATWIJUKA-ELIA/hack-proc1.git}
        REPO_REF: ${REPO_REF:-trunk}
    ports:
      - "8000:8000"
    restart: unless-stopped
